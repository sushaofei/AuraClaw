resolver 127.0.0.11 valid=5s ipv6=off;

upstream auraclaw_task_api {
    zone auraclaw_task_api 64k;
    server task-api:8000 resolve;
}

upstream auraclaw_streaming_gateway {
    zone auraclaw_streaming_gateway 64k;
    server streaming-gateway:8010 resolve;
}

server {
    listen 8080;
    client_max_body_size 25m;

    location /v1/streams/ {
        proxy_pass http://auraclaw_streaming_gateway;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_read_timeout 1h;
    }

    location / {
        proxy_pass http://auraclaw_task_api;
        proxy_http_version 1.1;
    }
}
