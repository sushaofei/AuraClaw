upstream auraclaw_task_api {
    server task-api:8000;
}

upstream auraclaw_streaming_gateway {
    server streaming-gateway:8010;
}

server {
    listen 8080;
    client_max_body_size 16m;

    location /v1/streams/ {
        proxy_pass http://auraclaw_streaming_gateway;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_read_timeout 1h;
    }

    location / {
        proxy_pass http://auraclaw_task_api;
        proxy_http_version 1.1;
    }
}
