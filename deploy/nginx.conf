resolver 127.0.0.11 valid=5s ipv6=off;

map $http_x_forwarded_proto $auraclaw_forwarded_proto {
    default $http_x_forwarded_proto;
    "" $scheme;
}

upstream auraclaw_task_api {
    zone auraclaw_task_api 256k;
    server task-api:8000 resolve;
}

upstream auraclaw_streaming_gateway {
    zone auraclaw_streaming_gateway 256k;
    server streaming-gateway:8010 resolve;
}

server {
    listen 8080;
    server_tokens off;
    client_max_body_size 25m;
    client_header_timeout 10s;
    client_body_timeout 30s;
    large_client_header_buffers 4 16k;
    send_timeout 65s;

    proxy_connect_timeout 3s;
    proxy_send_timeout 30s;
    proxy_read_timeout 120s;
    proxy_next_upstream error timeout http_502 http_503 http_504;
    proxy_next_upstream_tries 2;

    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $auraclaw_forwarded_proto;
    proxy_set_header X-Request-ID $request_id;

    location /v1/streams/ {
        proxy_pass http://auraclaw_streaming_gateway;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 75s;
        add_header Cache-Control "no-cache" always;
        add_header X-Accel-Buffering "no" always;
    }

    location / {
        proxy_pass http://auraclaw_task_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }
}
