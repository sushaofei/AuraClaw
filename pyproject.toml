[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "auraclaw"
version = "0.1.0"
description = "Managed Agent backend service"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "aiokafka>=0.12,<1",
  "asyncpg>=0.30,<1",
  "cryptography>=50,<51",
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "jsonschema>=4.26,<5",
  "pydantic-settings>=2.6,<3",
  "regex>=2024.11,<2027",
  "socksio>=1.0,<2",
  "uvicorn[standard]>=0.32,<1",
]

[project.optional-dependencies]
dev = [
  "import-linter>=2.1,<3",
  "mypy>=1.13,<2",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.24,<1",
  "ruff>=0.8,<1",
]

[tool.importlinter]
root_package = "auraclaw"

[[tool.importlinter.contracts]]
name = "Evaluation logic uses ports rather than concrete adapters or composition"
type = "forbidden"
source_modules = ["auraclaw.evaluation"]
forbidden_modules = ["auraclaw.composition", "auraclaw.infrastructure", "auraclaw.api"]

[[tool.importlinter.contracts]]
name = "Production execution does not depend on benchmark tooling"
type = "forbidden"
source_modules = [
  "auraclaw.runtime", "auraclaw.action", "auraclaw.api", "auraclaw.session",
  "auraclaw.composition.builders", "auraclaw.composition.services",
]
forbidden_modules = ["auraclaw.evaluation", "auraclaw.composition.evaluation"]

[[tool.importlinter.contracts]]
name = "Catalog components do not depend on the compatibility facade"
type = "forbidden"
source_modules = ["auraclaw.action.catalog"]
forbidden_modules = ["auraclaw.action.capability_catalog"]

[[tool.importlinter.contracts]]
name = "Catalog storage publication search execution and schemas are independent"
type = "independence"
modules = [
  "auraclaw.action.catalog.memory",
  "auraclaw.action.catalog.publication",
  "auraclaw.action.catalog.search",
  "auraclaw.action.catalog.executors",
  "auraclaw.action.catalog.tools",
]

[[tool.importlinter.contracts]]
name = "Skill admin route groups do not depend on the router factory"
type = "forbidden"
source_modules = ["auraclaw.api.routes.skill_admin"]
forbidden_modules = ["auraclaw.api.routes.admin_skills"]

[[tool.importlinter.contracts]]
name = "Skill admin route groups are independent"
type = "independence"
modules = [
  "auraclaw.api.routes.skill_admin.catalog",
  "auraclaw.api.routes.skill_admin.admissions",
  "auraclaw.api.routes.skill_admin.publishers",
  "auraclaw.api.routes.skill_admin.installations",
  "auraclaw.api.routes.skill_admin.publications",
]

[[tool.importlinter.contracts]]
name = "Skill admin queries do not depend on delivery or concrete adapters"
type = "forbidden"
source_modules = [
  "auraclaw.action.skill_admin_queries",
  "auraclaw.action.skill_admission_query",
]
forbidden_modules = ["auraclaw.api", "auraclaw.composition", "auraclaw.infrastructure"]

[[tool.importlinter.contracts]]
name = "Execution services do not depend on their callers or controllers"
type = "forbidden"
source_modules = ["auraclaw.runtime.execution"]
forbidden_modules = [
  "auraclaw.runtime.execution_engine",
  "auraclaw.runtime.harness",
  "auraclaw.runtime.capability_controller",
  "auraclaw.runtime.collaboration_controller",
  "auraclaw.runtime.task_router",
]

[[tool.importlinter.contracts]]
name = "Recovery budget and context have independent ownership"
type = "independence"
modules = [
  "auraclaw.runtime.execution.recovery",
  "auraclaw.runtime.execution.budget",
  "auraclaw.runtime.execution.context",
]

[[tool.importlinter.contracts]]
name = "Capability components do not depend on their callers"
type = "forbidden"
source_modules = ["auraclaw.runtime.capabilities"]
forbidden_modules = [
  "auraclaw.runtime.capability_controller",
  "auraclaw.runtime.execution_engine",
  "auraclaw.runtime.task_router",
]

[[tool.importlinter.contracts]]
name = "Capability responsibilities are independent"
type = "independence"
modules = [
  "auraclaw.runtime.capabilities.skills",
  "auraclaw.runtime.capabilities.prompts",
  "auraclaw.runtime.capabilities.resources",
  "auraclaw.runtime.capabilities.model_tools",
]

[[tool.importlinter.contracts]]
name = "Service builders and support do not depend on the dispatcher"
type = "forbidden"
source_modules = [
  "auraclaw.composition.builders",
  "auraclaw.composition.adapters",
  "auraclaw.composition.service_spec",
  "auraclaw.composition.service_host",
  "auraclaw.composition.security",
  "auraclaw.composition.skill_services",
  "auraclaw.composition.credential_services",
]
forbidden_modules = ["auraclaw.composition.services"]

[[tool.importlinter.contracts]]
name = "Composition support does not depend on service builders"
type = "forbidden"
source_modules = [
  "auraclaw.composition.adapters",
  "auraclaw.composition.service_spec",
  "auraclaw.composition.service_host",
  "auraclaw.composition.security",
  "auraclaw.composition.skill_services",
  "auraclaw.composition.credential_services",
]
forbidden_modules = ["auraclaw.composition.builders"]

[[tool.importlinter.contracts]]
name = "Contracts are framework independent"
type = "forbidden"
source_modules = ["auraclaw.contracts"]
forbidden_modules = [
  "auraclaw.action",
  "auraclaw.api",
  "auraclaw.composition",
  "auraclaw.control",
  "auraclaw.delivery",
  "auraclaw.domain",
  "auraclaw.gateways",
  "auraclaw.infrastructure",
  "auraclaw.observability",
  "auraclaw.projection",
  "auraclaw.runtime",
  "auraclaw.session",
]

[[tool.importlinter.contracts]]
name = "Domain only depends on contracts"
type = "forbidden"
source_modules = ["auraclaw.domain"]
forbidden_modules = [
  "auraclaw.action",
  "auraclaw.api",
  "auraclaw.composition",
  "auraclaw.control",
  "auraclaw.delivery",
  "auraclaw.gateways",
  "auraclaw.infrastructure",
  "auraclaw.observability",
  "auraclaw.projection",
  "auraclaw.runtime",
  "auraclaw.session",
]

[[tool.importlinter.contracts]]
name = "API is transport only"
type = "forbidden"
source_modules = ["auraclaw.api"]
forbidden_modules = ["auraclaw.composition", "auraclaw.infrastructure"]

[[tool.importlinter.contracts]]
name = "Gateways do not select adapters"
type = "forbidden"
source_modules = ["auraclaw.gateways"]
forbidden_modules = ["auraclaw.composition", "auraclaw.infrastructure"]

[[tool.importlinter.contracts]]
name = "Infrastructure ignores delivery surfaces and composition"
type = "forbidden"
source_modules = ["auraclaw.infrastructure"]
forbidden_modules = ["auraclaw.api", "auraclaw.composition", "auraclaw.gateways"]

[[tool.importlinter.contracts]]
name = "Business packages do not import composition"
type = "forbidden"
source_modules = [
  "auraclaw.action",
  "auraclaw.control",
  "auraclaw.delivery",
  "auraclaw.observability",
  "auraclaw.projection",
  "auraclaw.runtime",
  "auraclaw.session",
]
forbidden_modules = ["auraclaw.composition"]

[[tool.importlinter.contracts]]
name = "Read gateways do not call Session write services"
type = "forbidden"
source_modules = ["auraclaw.gateways.query", "auraclaw.gateways.streaming"]
forbidden_modules = ["auraclaw.session.task_service", "auraclaw.session.collaboration_service"]

[[tool.importlinter.contracts]]
name = "Projection rules are adapter independent"
type = "forbidden"
source_modules = [
  "auraclaw.projection.approval",
  "auraclaw.projection.collaboration",
  "auraclaw.projection.task",
]
forbidden_modules = ["auraclaw.infrastructure"]

[[tool.importlinter.contracts]]
name = "Runtime does not embed Action Hands"
type = "forbidden"
source_modules = ["auraclaw.runtime"]
forbidden_modules = [
  "auraclaw.action",
  "auraclaw.contracts.mcp",
  "auraclaw.infrastructure.connectors",
  "auraclaw.infrastructure.hands",
]

[[tool.importlinter.contracts]]
name = "Action Hands business and Skill lifecycle adapters do not depend on Runtime or Control"
type = "forbidden"
source_modules = [
  "auraclaw.action",
  "auraclaw.infrastructure.persistence.postgres_skill_lifecycle",
  "auraclaw.infrastructure.persistence.postgres_skill_package_records",
  "auraclaw.infrastructure.persistence.postgres_skill_publication_records",
  "auraclaw.infrastructure.persistence.postgres_skill_installation_records",
]
forbidden_modules = ["auraclaw.runtime", "auraclaw.control"]

[project.scripts]
auraclaw = "auraclaw.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/auraclaw"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["auraclaw"]
plugins = ["pydantic.mypy"]
