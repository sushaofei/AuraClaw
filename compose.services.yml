x-auraclaw-service: &auraclaw-service
  build:
    context: .
  image: auraclaw:local
  restart: unless-stopped
  stop_grace_period: 20s
  extra_hosts:
    - "host.docker.internal:host-gateway"
  networks:
    - auraclaw

x-common-environment: &common-environment
  AURACLAW_DEPLOYMENT_PROFILE: ${AURACLAW_DEPLOYMENT_PROFILE:-production}
  AURACLAW_HOST: 0.0.0.0
  AURACLAW_LOG_LEVEL: ${AURACLAW_LOG_LEVEL:-INFO}
  AURACLAW_PROJECTION_WORKER_INTERVAL: ${AURACLAW_PROJECTION_WORKER_INTERVAL:-0.1}
  AURACLAW_ORCHESTRATOR_WORKER_INTERVAL: ${AURACLAW_ORCHESTRATOR_WORKER_INTERVAL:-0.1}
  AURACLAW_WORKER_WAKE_ENABLED: ${AURACLAW_WORKER_WAKE_ENABLED:-true}
  AURACLAW_WORKER_IDLE_INTERVAL: ${AURACLAW_WORKER_IDLE_INTERVAL:-0.25}

services:
  task-api:
    <<: *auraclaw-service
    networks: [auraclaw, platform]
    environment:
      <<: *common-environment
      AURACLAW_STORAGE_BACKEND: ${AURACLAW_STORAGE_BACKEND:-mysql}
      AURACLAW_DATABASE_URL: ${TASK_QUERY_DATABASE_URL:-}
      AURACLAW_SESSION_BASE_URL: http://session:8001
      AURACLAW_TASK_API_WORKLOAD_TOKEN: ${TASK_API_WORKLOAD_TOKEN:-}
    command: ["api", "run", "--host", "0.0.0.0", "--port", "8000"]
    ports: ["8000:8000"]
    healthcheck: &health-8000
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready')"]
      interval: 10s
      timeout: 3s
      retries: 6

  session:
    <<: *auraclaw-service
    networks: [auraclaw, platform]
    environment:
      <<: *common-environment
      AURACLAW_STORAGE_BACKEND: ${AURACLAW_STORAGE_BACKEND:-mysql}
      AURACLAW_DATABASE_URL: ${SESSION_DATABASE_URL:-}
      AURACLAW_LEASE_SIGNING_KEY: ${LEASE_SIGNING_KEY:-}
      AURACLAW_TASK_API_WORKLOAD_TOKEN: ${TASK_API_WORKLOAD_TOKEN:-}
      AURACLAW_PROJECTION_WORKLOAD_TOKEN: ${PROJECTION_WORKLOAD_TOKEN:-}
      AURACLAW_ORCHESTRATOR_WORKLOAD_TOKEN: ${ORCHESTRATOR_WORKLOAD_TOKEN:-}
      AURACLAW_RUNTIME_WORKLOAD_TOKEN: ${RUNTIME_WORKLOAD_TOKEN:-}
      AURACLAW_POLICY_WORKLOAD_TOKEN: ${POLICY_WORKLOAD_TOKEN:-}
      AURACLAW_DELIVERY_WORKLOAD_TOKEN: ${DELIVERY_WORKLOAD_TOKEN:-}
      AURACLAW_PROJECTION_BASE_URL: http://projection-worker:8002
      AURACLAW_CONTROL_BASE_URL: http://orchestrator:8003
      AURACLAW_RUNTIME_BASE_URL: http://agent-runtime:8004
      AURACLAW_DELIVERY_BASE_URL: http://delivery-worker:8011
    command: ["session", "run", "--host", "0.0.0.0", "--port", "8001"]
    ports: ["8001:8001"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health/ready')"]
      interval: 10s
      timeout: 3s
      retries: 6

  projection-worker:
    <<: *auraclaw-service
    networks: [auraclaw, platform]
    environment:
      <<: *common-environment
      AURACLAW_STORAGE_BACKEND: ${AURACLAW_STORAGE_BACKEND:-mysql}
      AURACLAW_DATABASE_URL: ${PROJECTION_DATABASE_URL:-}
      AURACLAW_SESSION_BASE_URL: http://session:8001
      AURACLAW_PROJECTION_WORKLOAD_TOKEN: ${PROJECTION_WORKLOAD_TOKEN:-}
      AURACLAW_TASK_API_WORKLOAD_TOKEN: ${TASK_API_WORKLOAD_TOKEN:-}
    command: ["projection", "relay", "--watch", "--host", "0.0.0.0", "--port", "8002"]
    ports: ["8002:8002"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8002/health/ready')"]
      interval: 10s
      timeout: 3s
      retries: 6

  orchestrator:
    <<: *auraclaw-service
    networks: [auraclaw, platform]
    environment:
      <<: *common-environment
      AURACLAW_STORAGE_BACKEND: ${AURACLAW_STORAGE_BACKEND:-mysql}
      AURACLAW_DATABASE_URL: ${CONTROL_DATABASE_URL:-}
      AURACLAW_SESSION_BASE_URL: http://session:8001
      AURACLAW_ORCHESTRATOR_WORKLOAD_TOKEN: ${ORCHESTRATOR_WORKLOAD_TOKEN:-}
      AURACLAW_TASK_API_WORKLOAD_TOKEN: ${TASK_API_WORKLOAD_TOKEN:-}
      AURACLAW_RUNTIME_WORKLOAD_TOKEN: ${RUNTIME_WORKLOAD_TOKEN:-}
      AURACLAW_LEASE_SIGNING_KEY: ${LEASE_SIGNING_KEY:-}
    command: ["orchestrator", "run", "--host", "0.0.0.0", "--port", "8003"]
    ports: ["8003:8003"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8003/health/ready')"]
      interval: 10s
      timeout: 3s
      retries: 6

  agent-runtime:
    <<: *auraclaw-service
    environment:
      <<: *common-environment
      AURACLAW_STORAGE_BACKEND: memory
      AURACLAW_SESSION_BASE_URL: http://session:8001
      AURACLAW_CONTROL_BASE_URL: http://orchestrator:8003
      AURACLAW_MODEL_GATEWAY_BASE_URL: http://model-gateway:8005
      AURACLAW_HANDS_URL: http://action-hands:8006
      AURACLAW_ARTIFACT_BASE_URL: http://artifact-service:8009
      AURACLAW_RUNTIME_WORKLOAD_TOKEN: ${RUNTIME_WORKLOAD_TOKEN:-}
      AURACLAW_RUNTIME_EVENT_BACKEND: ${AURACLAW_RUNTIME_EVENT_BACKEND:-memory}
      KAFKA_HOST: ${KAFKA_HOST:-}
      KAFKA_PORT: ${KAFKA_PORT:-9092}
    command: ["runtime", "run", "--host", "0.0.0.0", "--port", "8004"]
    ports: ["8004:8004"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8004/health/ready')"]
      interval: 10s
      timeout: 3s
      retries: 6

  model-gateway:
    <<: *auraclaw-service
    networks: [auraclaw, platform]
    environment:
      <<: *common-environment
      AURACLAW_STORAGE_BACKEND: ${AURACLAW_STORAGE_BACKEND:-mysql}
      AURACLAW_DATABASE_URL: ${MODEL_DATABASE_URL:-}
      AURACLAW_MODEL_API_KEY: ${AURACLAW_MODEL_API_KEY:-}
      AURACLAW_MODEL_BASE_URL: ${AURACLAW_MODEL_BASE_URL:-}
      AURACLAW_MODEL_NAME: ${AURACLAW_MODEL_NAME:-}
      AURACLAW_MODEL_PROVIDER: ${AURACLAW_MODEL_PROVIDER:-openai_compatible}
      AURACLAW_MODEL_TENANT_TOKEN_LIMIT_PER_HOUR: ${AURACLAW_MODEL_TENANT_TOKEN_LIMIT_PER_HOUR:-1000000}
      AURACLAW_RUNTIME_WORKLOAD_TOKEN: ${RUNTIME_WORKLOAD_TOKEN:-}
      AURACLAW_POLICY_BASE_URL: http://policy:8007
      AURACLAW_MODEL_GATEWAY_WORKLOAD_TOKEN: ${MODEL_GATEWAY_WORKLOAD_TOKEN:-}
    command: ["model-gateway", "run", "--host", "0.0.0.0", "--port", "8005"]
    ports: ["8005:8005"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8005/health/ready')"]
      interval: 10s
      timeout: 3s
      retries: 6

  action-hands:
    <<: *auraclaw-service
    networks: [auraclaw, platform]
    environment:
      <<: *common-environment
      AURACLAW_STORAGE_BACKEND: ${AURACLAW_STORAGE_BACKEND:-mysql}
      AURACLAW_DATABASE_URL: ${HANDS_DATABASE_URL:-}
      AURACLAW_RUNTIME_WORKLOAD_TOKEN: ${RUNTIME_WORKLOAD_TOKEN:-}
      AURACLAW_ACTION_HANDS_WORKLOAD_TOKEN: ${ACTION_HANDS_WORKLOAD_TOKEN:-}
      AURACLAW_LEASE_SIGNING_KEY: ${LEASE_SIGNING_KEY:-}
      AURACLAW_POLICY_BASE_URL: http://policy:8007
      AURACLAW_CREDENTIAL_PROXY_BASE_URL: http://credential-proxy:8008
      AURACLAW_ARTIFACT_BASE_URL: http://artifact-service:8009
    command: ["hands", "run", "--host", "0.0.0.0", "--port", "8006"]
    ports: ["8006:8006"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8006/health/ready')"]
      interval: 10s
      timeout: 3s
      retries: 6

  policy:
    <<: *auraclaw-service
    networks: [auraclaw, platform]
    environment:
      <<: *common-environment
      AURACLAW_STORAGE_BACKEND: ${AURACLAW_STORAGE_BACKEND:-mysql}
      AURACLAW_DATABASE_URL: ${POLICY_DATABASE_URL:-}
      AURACLAW_SESSION_BASE_URL: http://session:8001
      AURACLAW_POLICY_WORKLOAD_TOKEN: ${POLICY_WORKLOAD_TOKEN:-}
      AURACLAW_ACTION_HANDS_WORKLOAD_TOKEN: ${ACTION_HANDS_WORKLOAD_TOKEN:-}
      AURACLAW_MODEL_GATEWAY_WORKLOAD_TOKEN: ${MODEL_GATEWAY_WORKLOAD_TOKEN:-}
      AURACLAW_TASK_API_WORKLOAD_TOKEN: ${TASK_API_WORKLOAD_TOKEN:-}
      AURACLAW_ORCHESTRATOR_WORKLOAD_TOKEN: ${ORCHESTRATOR_WORKLOAD_TOKEN:-}
      AURACLAW_DELIVERY_WORKLOAD_TOKEN: ${DELIVERY_WORKLOAD_TOKEN:-}
      AURACLAW_CREDENTIAL_PROXY_WORKLOAD_TOKEN: ${CREDENTIAL_PROXY_WORKLOAD_TOKEN:-}
      AURACLAW_ARTIFACT_SERVICE_WORKLOAD_TOKEN: ${ARTIFACT_SERVICE_WORKLOAD_TOKEN:-}
    command: ["policy", "run", "--host", "0.0.0.0", "--port", "8007"]
    ports: ["8007:8007"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8007/health/ready')"]
      interval: 10s
      timeout: 3s
      retries: 6

  credential-proxy:
    <<: *auraclaw-service
    networks: [auraclaw, platform]
    environment:
      <<: *common-environment
      AURACLAW_STORAGE_BACKEND: ${AURACLAW_STORAGE_BACKEND:-mysql}
      AURACLAW_DATABASE_URL: ${CREDENTIAL_DATABASE_URL:-}
      AURACLAW_CREDENTIAL_EGRESS_ALLOWLIST: ${CREDENTIAL_EGRESS_ALLOWLIST:-}
      AURACLAW_CREDENTIAL_VAULT_ADDR: ${CREDENTIAL_VAULT_ADDR:-}
      AURACLAW_CREDENTIAL_VAULT_TOKEN: ${CREDENTIAL_VAULT_TOKEN:-}
      AURACLAW_CREDENTIAL_VAULT_MOUNT: ${CREDENTIAL_VAULT_MOUNT:-secret}
      AURACLAW_ACTION_HANDS_WORKLOAD_TOKEN: ${ACTION_HANDS_WORKLOAD_TOKEN:-}
      AURACLAW_DELIVERY_WORKLOAD_TOKEN: ${DELIVERY_WORKLOAD_TOKEN:-}
      AURACLAW_TASK_API_WORKLOAD_TOKEN: ${TASK_API_WORKLOAD_TOKEN:-}
      AURACLAW_CREDENTIAL_PROXY_WORKLOAD_TOKEN: ${CREDENTIAL_PROXY_WORKLOAD_TOKEN:-}
      AURACLAW_POLICY_BASE_URL: http://policy:8007
    command: ["credential-proxy", "run", "--host", "0.0.0.0", "--port", "8008"]
    ports: ["8008:8008"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8008/health/ready')"]
      interval: 10s
      timeout: 3s
      retries: 6

  artifact-service:
    <<: *auraclaw-service
    networks: [auraclaw, platform]
    environment:
      <<: *common-environment
      AURACLAW_STORAGE_BACKEND: ${AURACLAW_STORAGE_BACKEND:-mysql}
      AURACLAW_DATABASE_URL: ${ARTIFACT_DATABASE_URL:-}
      AURACLAW_ARTIFACT_BACKEND: seaweedfs
      SEAWEEDFS_HOST: ${SEAWEEDFS_HOST:-}
      SEAWEEDFS_S3_PORT: ${SEAWEEDFS_S3_PORT:-8333}
      SEAWEEDFS_ACCESS_KEY: ${SEAWEEDFS_ACCESS_KEY:-}
      SEAWEEDFS_SECRET_KEY: ${SEAWEEDFS_SECRET_KEY:-}
      SEAWEEDFS_BUCKET: ${SEAWEEDFS_BUCKET:-auraclaw-artifacts}
      SEAWEEDFS_REGION: ${SEAWEEDFS_REGION:-us-east-1}
      SEAWEEDFS_USE_SSL: ${SEAWEEDFS_USE_SSL:-false}
      SEAWEEDFS_PATH_STYLE: ${SEAWEEDFS_PATH_STYLE:-true}
      AURACLAW_ACTION_HANDS_WORKLOAD_TOKEN: ${ACTION_HANDS_WORKLOAD_TOKEN:-}
      AURACLAW_TASK_API_WORKLOAD_TOKEN: ${TASK_API_WORKLOAD_TOKEN:-}
      AURACLAW_DELIVERY_WORKLOAD_TOKEN: ${DELIVERY_WORKLOAD_TOKEN:-}
      AURACLAW_ARTIFACT_SERVICE_WORKLOAD_TOKEN: ${ARTIFACT_SERVICE_WORKLOAD_TOKEN:-}
      AURACLAW_POLICY_BASE_URL: http://policy:8007
    command: ["artifact", "run", "--host", "0.0.0.0", "--port", "8009"]
    ports: ["8009:8009"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8009/health/ready')"]
      interval: 10s
      timeout: 3s
      retries: 6

  streaming-gateway:
    <<: *auraclaw-service
    networks: [auraclaw, platform]
    environment:
      <<: *common-environment
      AURACLAW_STORAGE_BACKEND: ${AURACLAW_STORAGE_BACKEND:-mysql}
      AURACLAW_DATABASE_URL: ${STREAMING_DATABASE_URL:-}
      AURACLAW_RUNTIME_EVENT_BACKEND: ${AURACLAW_RUNTIME_EVENT_BACKEND:-memory}
      KAFKA_HOST: ${KAFKA_HOST:-}
      KAFKA_PORT: ${KAFKA_PORT:-9092}
    command: ["streaming", "run", "--host", "0.0.0.0", "--port", "8010"]
    ports: ["8010:8010"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8010/health/ready')"]
      interval: 10s
      timeout: 3s
      retries: 6

  delivery-worker:
    <<: *auraclaw-service
    networks: [auraclaw, platform]
    environment:
      <<: *common-environment
      AURACLAW_STORAGE_BACKEND: ${AURACLAW_STORAGE_BACKEND:-mysql}
      AURACLAW_DATABASE_URL: ${DELIVERY_DATABASE_URL:-}
      AURACLAW_SESSION_BASE_URL: http://session:8001
      AURACLAW_POLICY_BASE_URL: http://policy:8007
      AURACLAW_CREDENTIAL_PROXY_BASE_URL: http://credential-proxy:8008
      AURACLAW_ARTIFACT_BASE_URL: http://artifact-service:8009
      AURACLAW_DELIVERY_WORKLOAD_TOKEN: ${DELIVERY_WORKLOAD_TOKEN:-}
      AURACLAW_TASK_API_WORKLOAD_TOKEN: ${TASK_API_WORKLOAD_TOKEN:-}
    command: ["delivery", "run", "--host", "0.0.0.0", "--port", "8011"]
    ports: ["8011:8011"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8011/health/ready')"]
      interval: 10s
      timeout: 3s
      retries: 6

  ingress:
    image: nginx:1.27-alpine
    profiles: ["ingress"]
    depends_on:
      task-api:
        condition: service_healthy
      streaming-gateway:
        condition: service_healthy
    ports: ["8080:8080"]
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - auraclaw
      - platform

networks:
  auraclaw:
    name: auraclaw
    internal: true
  platform:
    name: auraclaw-platform
