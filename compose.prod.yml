# Production Compose (secrets, replicas, no Kafka localhost proxy).
name: auraclaw

x-auraclaw-service: &auraclaw-service
  image: ${AURACLAW_IMAGE:-ghcr.io/example/auraclaw:replace-with-immutable-sha}
  user: "10001:10001"
  read_only: true
  init: true
  restart: unless-stopped
  stop_grace_period: 60s
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  tmpfs:
    - /tmp:rw,noexec,nosuid,nodev,size=1g
  networks: [auraclaw]
  logging:
    driver: json-file
    options:
      max-size: 20m
      max-file: "5"

x-common-environment: &common-environment
  AURACLAW_MIGRATIONS_DIRECTORY: ${AURACLAW_MIGRATIONS_DIRECTORY:-/app/migrations}
  AURACLAW_DEPLOYMENT_PROFILE: production
  AURACLAW_HOST: 0.0.0.0
  AURACLAW_LOG_LEVEL: ${AURACLAW_LOG_LEVEL:-INFO}
  AURACLAW_STORAGE_BACKEND: ${AURACLAW_STORAGE_BACKEND:-kingbase}
  AURACLAW_SESSION_BASE_URL: http://session:8001
  AURACLAW_PROJECTION_BASE_URL: http://projection-worker:8002
  AURACLAW_CONTROL_BASE_URL: http://orchestrator:8003
  AURACLAW_RUNTIME_BASE_URL: http://agent-runtime:8004
  AURACLAW_MODEL_GATEWAY_BASE_URL: http://model-gateway:8005
  AURACLAW_HANDS_URL: http://action-hands:8006
  AURACLAW_POLICY_BASE_URL: http://policy:8007
  AURACLAW_CREDENTIAL_PROXY_BASE_URL: http://credential-proxy:8008
  AURACLAW_ARTIFACT_BASE_URL: http://artifact-service:8009
  AURACLAW_DELIVERY_BASE_URL: http://delivery-worker:8011
  AURACLAW_PROJECTION_WORKER_INTERVAL: ${AURACLAW_PROJECTION_WORKER_INTERVAL:-0.1}
  AURACLAW_ORCHESTRATOR_WORKER_INTERVAL: ${AURACLAW_ORCHESTRATOR_WORKER_INTERVAL:-0.1}
  AURACLAW_WORKER_WAKE_ENABLED: ${AURACLAW_WORKER_WAKE_ENABLED:-true}
  AURACLAW_WORKER_IDLE_INTERVAL: ${AURACLAW_WORKER_IDLE_INTERVAL:-0.25}
  AURACLAW_STREAM_DELTA_MIN_INTERVAL_SECONDS: ${AURACLAW_STREAM_DELTA_MIN_INTERVAL_SECONDS:-0.02}

x-healthcheck: &healthcheck
  test:
    - CMD
    - python
    - -c
    - "import os,urllib.request; urllib.request.urlopen('http://127.0.0.1:'+os.environ['AURACLAW_HEALTH_PORT']+'/health/ready',timeout=3)"
  interval: 10s
  timeout: 5s
  retries: 12
  start_period: 30s

x-update-policy: &update-policy
  parallelism: 1
  delay: 10s
  order: start-first
  failure_action: rollback
  monitor: 30s

x-rollback-policy: &rollback-policy
  parallelism: 1
  delay: 5s
  order: stop-first
  failure_action: pause
  monitor: 30s

services:
  migrate:
    <<: *auraclaw-service
    profiles: [migrate]
    restart: "no"
    networks: [platform]
    environment:
      AURACLAW_DEPLOYMENT_PROFILE: production
      AURACLAW_MIGRATION_DATABASE_URL_FILE: /run/secrets/migration_database_url
    secrets:
      - migration_database_url
    command:
      [
        "migrate",
        "up",
        "--target",
        "${AURACLAW_MIGRATE_TARGET:-0062}",
        "--directory",
        "${AURACLAW_MIGRATIONS_DIRECTORY:-/app/migrations}",
      ]
    deploy:
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      resources:
        reservations: {cpus: "0.10", memory: 128M}
        limits: {cpus: "1.00", memory: 512M}

  task-api:
    <<: *auraclaw-service
    networks: [auraclaw, platform]
    environment:
      <<: *common-environment
      AURACLAW_HEALTH_PORT: "8000"
      AURACLAW_DATABASE_URL_FILE: /run/secrets/database_url
      AURACLAW_TASK_API_WORKLOAD_TOKEN_FILE: /run/secrets/task_api_workload_token
      AURACLAW_CHAINTOWER_WORKLOAD_TOKEN_FILE: /run/secrets/chaintower_workload_token
      AURACLAW_AGENT_CONTEXT_SIGNING_KEYS_JSON_FILE: /run/secrets/agent_context_signing_keys_json
      AURACLAW_AGENT_CONTEXT_ISSUER: ${AURACLAW_AGENT_CONTEXT_ISSUER:-chaintower}
      AURACLAW_AGENT_CONTEXT_AUDIENCE: ${AURACLAW_AGENT_CONTEXT_AUDIENCE:-auraclaw-task-api}
    secrets:
      [
        database_url,
        task_api_workload_token,
        chaintower_workload_token,
        agent_context_signing_keys_json,
      ]
    command: ["api", "run", "--host", "0.0.0.0", "--port", "8000"]
    expose: ["8000"]
    healthcheck: *healthcheck
    labels:
      auraclaw.service-identity: task-api
    deploy:
      replicas: 3
      update_config: *update-policy
      rollback_config: *rollback-policy
      restart_policy: {condition: on-failure, delay: 5s, max_attempts: 5, window: 60s}
      resources:
        reservations: {cpus: "0.25", memory: 256M}
        limits: {cpus: "1.00", memory: 1G}

  session:
    <<: *auraclaw-service
    networks: [auraclaw, platform]
    environment:
      <<: *common-environment
      AURACLAW_HEALTH_PORT: "8001"
      AURACLAW_DATABASE_URL_FILE: /run/secrets/database_url
      AURACLAW_LEASE_SIGNING_KEY_FILE: /run/secrets/lease_signing_key
      AURACLAW_TASK_API_WORKLOAD_TOKEN_FILE: /run/secrets/task_api_workload_token
      AURACLAW_PROJECTION_WORKLOAD_TOKEN_FILE: /run/secrets/projection_workload_token
      AURACLAW_ORCHESTRATOR_WORKLOAD_TOKEN_FILE: /run/secrets/orchestrator_workload_token
      AURACLAW_RUNTIME_WORKLOAD_TOKEN_FILE: /run/secrets/runtime_workload_token
      AURACLAW_POLICY_WORKLOAD_TOKEN_FILE: /run/secrets/policy_workload_token
      AURACLAW_DELIVERY_WORKLOAD_TOKEN_FILE: /run/secrets/delivery_workload_token
      AURACLAW_STREAMING_GATEWAY_WORKLOAD_TOKEN_FILE: /run/secrets/streaming_gateway_workload_token
      AURACLAW_ACTION_HANDS_WORKLOAD_TOKEN_FILE: /run/secrets/action_hands_workload_token
    secrets:
      - database_url
      - lease_signing_key
      - task_api_workload_token
      - projection_workload_token
      - orchestrator_workload_token
      - runtime_workload_token
      - policy_workload_token
      - delivery_workload_token
      - streaming_gateway_workload_token
      - action_hands_workload_token
    command: ["session", "run", "--host", "0.0.0.0", "--port", "8001"]
    expose: ["8001"]
    healthcheck: *healthcheck
    labels:
      auraclaw.service-identity: session
    deploy:
      replicas: 3
      update_config: *update-policy
      rollback_config: *rollback-policy
      restart_policy: {condition: on-failure, delay: 5s, max_attempts: 5, window: 60s}
      resources:
        reservations: {cpus: "0.50", memory: 512M}
        limits: {cpus: "2.00", memory: 2G}

  projection-worker:
    <<: *auraclaw-service
    networks: [auraclaw, platform]
    environment:
      <<: *common-environment
      AURACLAW_HEALTH_PORT: "8002"
      AURACLAW_DATABASE_URL_FILE: /run/secrets/database_url
      AURACLAW_PROJECTION_WORKLOAD_TOKEN_FILE: /run/secrets/projection_workload_token
      AURACLAW_TASK_API_WORKLOAD_TOKEN_FILE: /run/secrets/task_api_workload_token
    secrets:
      - database_url
      - projection_workload_token
      - task_api_workload_token
    command: ["projection", "relay", "--watch", "--host", "0.0.0.0", "--port", "8002"]
    expose: ["8002"]
    healthcheck: *healthcheck
    labels:
      auraclaw.service-identity: projection-worker
    deploy:
      replicas: 2
      update_config: *update-policy
      rollback_config: *rollback-policy
      restart_policy: {condition: on-failure, delay: 5s, max_attempts: 5, window: 60s}
      resources:
        reservations: {cpus: "0.50", memory: 512M}
        limits: {cpus: "2.00", memory: 2G}

  orchestrator:
    <<: *auraclaw-service
    networks: [auraclaw, platform]
    environment:
      <<: *common-environment
      AURACLAW_HEALTH_PORT: "8003"
      AURACLAW_DATABASE_URL_FILE: /run/secrets/database_url
      AURACLAW_LEASE_SIGNING_KEY_FILE: /run/secrets/lease_signing_key
      AURACLAW_ORCHESTRATOR_WORKLOAD_TOKEN_FILE: /run/secrets/orchestrator_workload_token
      AURACLAW_TASK_API_WORKLOAD_TOKEN_FILE: /run/secrets/task_api_workload_token
      AURACLAW_RUNTIME_WORKLOAD_TOKEN_FILE: /run/secrets/runtime_workload_token
      AURACLAW_ORCHESTRATOR_LEASE_TTL_SECONDS: ${AURACLAW_ORCHESTRATOR_LEASE_TTL_SECONDS:-300}
    secrets:
      - database_url
      - lease_signing_key
      - orchestrator_workload_token
      - task_api_workload_token
      - runtime_workload_token
    command: ["orchestrator", "run", "--host", "0.0.0.0", "--port", "8003"]
    expose: ["8003"]
    healthcheck: *healthcheck
    labels:
      auraclaw.service-identity: orchestrator
    deploy:
      replicas: 3
      update_config: *update-policy
      rollback_config: *rollback-policy
      restart_policy: {condition: on-failure, delay: 5s, max_attempts: 5, window: 60s}
      resources:
        reservations: {cpus: "0.25", memory: 256M}
        limits: {cpus: "1.00", memory: 1G}

  agent-runtime:
    <<: *auraclaw-service
    # platform network is required to reach host Kafka / Redis / PostgreSQL CIDRs
    networks: [auraclaw, platform]
    environment:
      <<: *common-environment
      AURACLAW_HEALTH_PORT: "8004"
      AURACLAW_STORAGE_BACKEND: memory
      AURACLAW_RUNTIME_WORKLOAD_TOKEN_FILE: /run/secrets/runtime_workload_token
      AURACLAW_RUNTIME_EVENT_BACKEND: ${AURACLAW_RUNTIME_EVENT_BACKEND:-kafka}
      KAFKA_HOST: ${KAFKA_HOST:-host.docker.internal}
      KAFKA_PORT: ${KAFKA_PORT:-9092}
      AURACLAW_RUNTIME_EVENT_PUBLISH_MAX_CONCURRENT: ${AURACLAW_RUNTIME_EVENT_PUBLISH_MAX_CONCURRENT:-64}
      AURACLAW_RUNTIME_EVENT_PUBLISH_MAX_QUEUED: ${AURACLAW_RUNTIME_EVENT_PUBLISH_MAX_QUEUED:-1024}
      AURACLAW_RUNTIME_EVENT_PUBLISH_QUEUE_TIMEOUT_SECONDS: ${AURACLAW_RUNTIME_EVENT_PUBLISH_QUEUE_TIMEOUT_SECONDS:-5}
      AURACLAW_RUNTIME_EVENT_PUBLISH_TIMEOUT_SECONDS: ${AURACLAW_RUNTIME_EVENT_PUBLISH_TIMEOUT_SECONDS:-10}
      AURACLAW_RUNTIME_SKILL_CONTENT_CACHE_MAX_BYTES: ${AURACLAW_RUNTIME_SKILL_CONTENT_CACHE_MAX_BYTES:-16777216}
      AURACLAW_RUNTIME_SKILL_CONTENT_CACHE_MAX_ENTRIES: ${AURACLAW_RUNTIME_SKILL_CONTENT_CACHE_MAX_ENTRIES:-1024}
      AURACLAW_RUNTIME_SKILL_CONTENT_CACHE_TTL_SECONDS: ${AURACLAW_RUNTIME_SKILL_CONTENT_CACHE_TTL_SECONDS:-900}
      AURACLAW_RUNTIME_SKILL_PROMPT_MAX_BYTES: ${AURACLAW_RUNTIME_SKILL_PROMPT_MAX_BYTES:-262144}
      AURACLAW_RUNTIME_SKILL_PROMPT_MAX_ESTIMATED_TOKENS: ${AURACLAW_RUNTIME_SKILL_PROMPT_MAX_ESTIMATED_TOKENS:-65536}
    secrets: [runtime_workload_token]
    command: ["runtime", "run", "--host", "0.0.0.0", "--port", "8004"]
    expose: ["8004"]
    healthcheck: *healthcheck
    labels:
      auraclaw.service-identity: agent-runtime
    deploy:
      replicas: 3
      update_config: *update-policy
      rollback_config: *rollback-policy
      restart_policy: {condition: on-failure, delay: 5s, max_attempts: 5, window: 60s}
      resources:
        reservations: {cpus: "0.50", memory: 512M}
        limits: {cpus: "4.00", memory: 4G}

  model-gateway:
    <<: *auraclaw-service
    networks: [auraclaw, platform]
    environment:
      <<: *common-environment
      AURACLAW_HEALTH_PORT: "8005"
      AURACLAW_DATABASE_URL_FILE: /run/secrets/database_url
      AURACLAW_MODEL_API_KEY_FILE: /run/secrets/model_api_key
      AURACLAW_RUNTIME_WORKLOAD_TOKEN_FILE: /run/secrets/runtime_workload_token
      AURACLAW_MODEL_GATEWAY_WORKLOAD_TOKEN_FILE: /run/secrets/model_gateway_workload_token
      AURACLAW_MODEL_BASE_URL: ${AURACLAW_MODEL_BASE_URL:-}
      AURACLAW_MODEL_NAME: ${AURACLAW_MODEL_NAME:-}
      AURACLAW_MODEL_PROVIDER: ${AURACLAW_MODEL_PROVIDER:-openai_compatible}
      AURACLAW_MODEL_PROMPT_CACHE_KEY_ENABLED: ${AURACLAW_MODEL_PROMPT_CACHE_KEY_ENABLED:-false}
      AURACLAW_MODEL_TENANT_TOKEN_LIMIT_PER_HOUR: ${AURACLAW_MODEL_TENANT_TOKEN_LIMIT_PER_HOUR:-1000000}
    secrets:
      - database_url
      - model_api_key
      - runtime_workload_token
      - model_gateway_workload_token
    command: ["model-gateway", "run", "--host", "0.0.0.0", "--port", "8005"]
    expose: ["8005"]
    healthcheck: *healthcheck
    labels:
      auraclaw.service-identity: model-gateway
    deploy:
      replicas: 2
      update_config: *update-policy
      rollback_config: *rollback-policy
      restart_policy: {condition: on-failure, delay: 5s, max_attempts: 5, window: 60s}
      resources:
        reservations: {cpus: "0.50", memory: 512M}
        limits: {cpus: "4.00", memory: 4G}

  action-hands:
    <<: *auraclaw-service
    networks: [auraclaw, platform]
    working_dir: /workspace
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=1g
      - /workspace:rw,nosuid,nodev,size=2g
    environment:
      <<: *common-environment
      AURACLAW_HEALTH_PORT: "8006"
      AURACLAW_DATABASE_URL_FILE: /run/secrets/database_url
      AURACLAW_LEASE_SIGNING_KEY_FILE: /run/secrets/lease_signing_key
      AURACLAW_RUNTIME_WORKLOAD_TOKEN_FILE: /run/secrets/runtime_workload_token
      AURACLAW_ACTION_HANDS_WORKLOAD_TOKEN_FILE: /run/secrets/action_hands_workload_token
      AURACLAW_TASK_API_WORKLOAD_TOKEN_FILE: /run/secrets/task_api_workload_token
      AURACLAW_CREDENTIAL_PROXY_WORKLOAD_TOKEN_FILE: /run/secrets/credential_proxy_workload_token
      AURACLAW_HANDS_MAX_CONCURRENT: ${AURACLAW_HANDS_MAX_CONCURRENT:-32}
      AURACLAW_HANDS_MAX_CONCURRENT_PER_TENANT: ${AURACLAW_HANDS_MAX_CONCURRENT_PER_TENANT:-8}
      AURACLAW_HANDS_MAX_QUEUED: ${AURACLAW_HANDS_MAX_QUEUED:-256}
      AURACLAW_HANDS_MAX_QUEUED_PER_TENANT: ${AURACLAW_HANDS_MAX_QUEUED_PER_TENANT:-32}
      AURACLAW_HANDS_QUEUE_TIMEOUT_SECONDS: ${AURACLAW_HANDS_QUEUE_TIMEOUT_SECONDS:-5}
      AURACLAW_SKILL_RELIABILITY_MAX_CONCURRENT: ${AURACLAW_SKILL_RELIABILITY_MAX_CONCURRENT:-8}
      AURACLAW_SKILL_RELIABILITY_CLAIM_TTL_SECONDS: ${AURACLAW_SKILL_RELIABILITY_CLAIM_TTL_SECONDS:-30}
      AURACLAW_SKILL_CONTENT_CACHE_MAX_BYTES: ${AURACLAW_SKILL_CONTENT_CACHE_MAX_BYTES:-67108864}
      AURACLAW_SKILL_CONTENT_CACHE_MAX_ENTRIES: ${AURACLAW_SKILL_CONTENT_CACHE_MAX_ENTRIES:-1024}
      AURACLAW_SKILL_CONTENT_CACHE_TTL_SECONDS: ${AURACLAW_SKILL_CONTENT_CACHE_TTL_SECONDS:-3600}
      KAFKA_HOST: ${KAFKA_HOST:-host.docker.internal}
      KAFKA_PORT: ${KAFKA_PORT:-9092}
      AURACLAW_KAFKA_SKILL_LIFECYCLE_TOPIC: ${AURACLAW_KAFKA_SKILL_LIFECYCLE_TOPIC:-managed-agent.skill-lifecycle}
      AURACLAW_SKILL_TRANSACTION_RETRY_ATTEMPTS: ${AURACLAW_SKILL_TRANSACTION_RETRY_ATTEMPTS:-3}
      AURACLAW_SKILL_TRANSACTION_RETRY_BASE_DELAY_SECONDS: ${AURACLAW_SKILL_TRANSACTION_RETRY_BASE_DELAY_SECONDS:-0.01}
      AURACLAW_MCP_RECONCILE_MAX_CONCURRENT: ${AURACLAW_MCP_RECONCILE_MAX_CONCURRENT:-8}
      AURACLAW_MCP_RECONCILE_MAX_CONCURRENT_PER_TENANT: ${AURACLAW_MCP_RECONCILE_MAX_CONCURRENT_PER_TENANT:-4}
      AURACLAW_MCP_RECONCILE_MAX_CONCURRENT_PER_HOST: ${AURACLAW_MCP_RECONCILE_MAX_CONCURRENT_PER_HOST:-2}
      AURACLAW_MCP_RECONCILE_SERVER_TIMEOUT_SECONDS: ${AURACLAW_MCP_RECONCILE_SERVER_TIMEOUT_SECONDS:-60}
      AURACLAW_RESOURCE_GATEWAY_MAX_CONCURRENT: ${AURACLAW_RESOURCE_GATEWAY_MAX_CONCURRENT:-32}
      AURACLAW_RESOURCE_GATEWAY_MAX_QUEUED: ${AURACLAW_RESOURCE_GATEWAY_MAX_QUEUED:-128}
      AURACLAW_RESOURCE_GATEWAY_QUEUE_TIMEOUT_SECONDS: ${AURACLAW_RESOURCE_GATEWAY_QUEUE_TIMEOUT_SECONDS:-5}
    secrets:
      - database_url
      - lease_signing_key
      - runtime_workload_token
      - action_hands_workload_token
      - task_api_workload_token
      - credential_proxy_workload_token
    command: ["hands", "run", "--host", "0.0.0.0", "--port", "8006"]
    expose: ["8006"]
    healthcheck: *healthcheck
    labels:
      auraclaw.service-identity: action-hands
    deploy:
      replicas: 2
      update_config: *update-policy
      rollback_config: *rollback-policy
      restart_policy: {condition: on-failure, delay: 5s, max_attempts: 5, window: 60s}
      resources:
        reservations: {cpus: "0.50", memory: 512M}
        limits: {cpus: "4.00", memory: 4G}

  policy:
    <<: *auraclaw-service
    networks: [auraclaw, platform]
    environment:
      <<: *common-environment
      AURACLAW_HEALTH_PORT: "8007"
      AURACLAW_DATABASE_URL_FILE: /run/secrets/database_url
      AURACLAW_POLICY_WORKLOAD_TOKEN_FILE: /run/secrets/policy_workload_token
      AURACLAW_ACTION_HANDS_WORKLOAD_TOKEN_FILE: /run/secrets/action_hands_workload_token
      AURACLAW_MODEL_GATEWAY_WORKLOAD_TOKEN_FILE: /run/secrets/model_gateway_workload_token
      AURACLAW_TASK_API_WORKLOAD_TOKEN_FILE: /run/secrets/task_api_workload_token
      AURACLAW_ORCHESTRATOR_WORKLOAD_TOKEN_FILE: /run/secrets/orchestrator_workload_token
      AURACLAW_DELIVERY_WORKLOAD_TOKEN_FILE: /run/secrets/delivery_workload_token
      AURACLAW_CREDENTIAL_PROXY_WORKLOAD_TOKEN_FILE: /run/secrets/credential_proxy_workload_token
      AURACLAW_ARTIFACT_SERVICE_WORKLOAD_TOKEN_FILE: /run/secrets/artifact_service_workload_token
    secrets:
      - database_url
      - policy_workload_token
      - action_hands_workload_token
      - model_gateway_workload_token
      - task_api_workload_token
      - orchestrator_workload_token
      - delivery_workload_token
      - credential_proxy_workload_token
      - artifact_service_workload_token
    command: ["policy", "run", "--host", "0.0.0.0", "--port", "8007"]
    expose: ["8007"]
    healthcheck: *healthcheck
    labels:
      auraclaw.service-identity: policy
    deploy:
      replicas: 2
      update_config: *update-policy
      rollback_config: *rollback-policy
      restart_policy: {condition: on-failure, delay: 5s, max_attempts: 5, window: 60s}
      resources:
        reservations: {cpus: "0.25", memory: 256M}
        limits: {cpus: "1.00", memory: 1G}

  credential-proxy:
    <<: *auraclaw-service
    networks: [auraclaw, platform]
    environment:
      <<: *common-environment
      AURACLAW_HEALTH_PORT: "8008"
      AURACLAW_DATABASE_URL_FILE: /run/secrets/database_url
      AURACLAW_CREDENTIAL_VAULT_TOKEN_FILE: /run/secrets/vault_token
      AURACLAW_CREDENTIAL_VAULT_ADDR: ${AURACLAW_CREDENTIAL_VAULT_ADDR:-}
      AURACLAW_CREDENTIAL_VAULT_MOUNT: ${AURACLAW_CREDENTIAL_VAULT_MOUNT:-secret}
      AURACLAW_CREDENTIAL_EGRESS_ALLOWLIST: ${AURACLAW_CREDENTIAL_EGRESS_ALLOWLIST:-}
      AURACLAW_ACTION_HANDS_WORKLOAD_TOKEN_FILE: /run/secrets/action_hands_workload_token
      AURACLAW_DELIVERY_WORKLOAD_TOKEN_FILE: /run/secrets/delivery_workload_token
      AURACLAW_TASK_API_WORKLOAD_TOKEN_FILE: /run/secrets/task_api_workload_token
      AURACLAW_CREDENTIAL_PROXY_WORKLOAD_TOKEN_FILE: /run/secrets/credential_proxy_workload_token
    secrets:
      - database_url
      - vault_token
      - action_hands_workload_token
      - delivery_workload_token
      - task_api_workload_token
      - credential_proxy_workload_token
    command: ["credential-proxy", "run", "--host", "0.0.0.0", "--port", "8008"]
    expose: ["8008"]
    healthcheck: *healthcheck
    labels:
      auraclaw.service-identity: credential-proxy
    deploy:
      replicas: 2
      update_config: *update-policy
      rollback_config: *rollback-policy
      restart_policy: {condition: on-failure, delay: 5s, max_attempts: 5, window: 60s}
      resources:
        reservations: {cpus: "0.25", memory: 256M}
        limits: {cpus: "1.00", memory: 1G}

  artifact-service:
    <<: *auraclaw-service
    networks: [auraclaw, platform]
    environment:
      <<: *common-environment
      AURACLAW_HEALTH_PORT: "8009"
      AURACLAW_DATABASE_URL_FILE: /run/secrets/database_url
      AURACLAW_ARTIFACT_BACKEND: ${AURACLAW_ARTIFACT_BACKEND:-obs}
      SEAWEEDFS_HOST: ${SEAWEEDFS_HOST:-}
      SEAWEEDFS_MASTER_PORT: ${SEAWEEDFS_MASTER_PORT:-9333}
      SEAWEEDFS_FILER_PORT: ${SEAWEEDFS_FILER_PORT:-8888}
      SEAWEEDFS_S3_PORT: ${SEAWEEDFS_S3_PORT:-8333}
      SEAWEEDFS_ACCESS_KEY: ${SEAWEEDFS_ACCESS_KEY:-}
      SEAWEEDFS_SECRET_KEY: ${SEAWEEDFS_SECRET_KEY:-}
      SEAWEEDFS_BUCKET: ${SEAWEEDFS_BUCKET:-auraclaw-artifacts}
      SEAWEEDFS_USE_SSL: ${SEAWEEDFS_USE_SSL:-false}
      SEAWEEDFS_PATH_STYLE: ${SEAWEEDFS_PATH_STYLE:-true}
      OBS_AK_FILE: /run/secrets/obs_ak
      OBS_SK_FILE: /run/secrets/obs_sk
      OBS_ENDPOINT: ${OBS_ENDPOINT:-}
      OBS_BUCKET: ${OBS_BUCKET:-auraclaw-artifacts}
      OBS_REGION: ${OBS_REGION:-us-east-1}
      OBS_USE_SSL: ${OBS_USE_SSL:-true}
      OBS_PATH_STYLE: ${OBS_PATH_STYLE:-false}
      OBS_DOMAIN: ${OBS_DOMAIN:-}
      OBS_TENANT_ID: ${OBS_TENANT_ID:-}
      AURACLAW_ACTION_HANDS_WORKLOAD_TOKEN_FILE: /run/secrets/action_hands_workload_token
      AURACLAW_TASK_API_WORKLOAD_TOKEN_FILE: /run/secrets/task_api_workload_token
      AURACLAW_DELIVERY_WORKLOAD_TOKEN_FILE: /run/secrets/delivery_workload_token
      AURACLAW_ARTIFACT_SERVICE_WORKLOAD_TOKEN_FILE: /run/secrets/artifact_service_workload_token
    secrets:
      - database_url
      - obs_ak
      - obs_sk
      - action_hands_workload_token
      - task_api_workload_token
      - delivery_workload_token
      - artifact_service_workload_token
    command: ["artifact", "run", "--host", "0.0.0.0", "--port", "8009"]
    expose: ["8009"]
    healthcheck: *healthcheck
    labels:
      auraclaw.service-identity: artifact-service
    deploy:
      replicas: 2
      update_config: *update-policy
      rollback_config: *rollback-policy
      restart_policy: {condition: on-failure, delay: 5s, max_attempts: 5, window: 60s}
      resources:
        reservations: {cpus: "0.50", memory: 512M}
        limits: {cpus: "2.00", memory: 2G}

  streaming-gateway:
    <<: *auraclaw-service
    networks: [auraclaw, platform]
    environment:
      <<: *common-environment
      AURACLAW_HEALTH_PORT: "8010"
      AURACLAW_DATABASE_URL_FILE: /run/secrets/database_url
      AURACLAW_RUNTIME_EVENT_BACKEND: ${AURACLAW_RUNTIME_EVENT_BACKEND:-kafka}
      KAFKA_HOST: ${KAFKA_HOST:-host.docker.internal}
      KAFKA_PORT: ${KAFKA_PORT:-9092}
      AURACLAW_STREAMING_GATEWAY_WORKLOAD_TOKEN_FILE: /run/secrets/streaming_gateway_workload_token
    secrets:
      - database_url
      - streaming_gateway_workload_token
    command: ["streaming", "run", "--host", "0.0.0.0", "--port", "8010"]
    expose: ["8010"]
    healthcheck: *healthcheck
    labels:
      auraclaw.service-identity: streaming-gateway
    deploy:
      replicas: 3
      update_config: *update-policy
      rollback_config: *rollback-policy
      restart_policy: {condition: on-failure, delay: 5s, max_attempts: 5, window: 60s}
      resources:
        reservations: {cpus: "0.50", memory: 512M}
        limits: {cpus: "2.00", memory: 2G}

  delivery-worker:
    <<: *auraclaw-service
    networks: [auraclaw, platform]
    environment:
      <<: *common-environment
      AURACLAW_HEALTH_PORT: "8011"
      AURACLAW_DATABASE_URL_FILE: /run/secrets/database_url
      AURACLAW_DELIVERY_WORKLOAD_TOKEN_FILE: /run/secrets/delivery_workload_token
      AURACLAW_TASK_API_WORKLOAD_TOKEN_FILE: /run/secrets/task_api_workload_token
      AURACLAW_DELIVERY_MAX_CONCURRENT: ${AURACLAW_DELIVERY_MAX_CONCURRENT:-8}
      AURACLAW_DELIVERY_MAX_CONCURRENT_PER_TENANT: ${AURACLAW_DELIVERY_MAX_CONCURRENT_PER_TENANT:-2}
      AURACLAW_DELIVERY_CLAIM_TTL_SECONDS: ${AURACLAW_DELIVERY_CLAIM_TTL_SECONDS:-30}
    secrets:
      - database_url
      - delivery_workload_token
      - task_api_workload_token
    command: ["delivery", "run", "--host", "0.0.0.0", "--port", "8011"]
    expose: ["8011"]
    healthcheck: *healthcheck
    labels:
      auraclaw.service-identity: delivery-worker
    deploy:
      replicas: 2
      update_config: *update-policy
      rollback_config: *rollback-policy
      restart_policy: {condition: on-failure, delay: 5s, max_attempts: 5, window: 60s}
      resources:
        reservations: {cpus: "0.25", memory: 256M}
        limits: {cpus: "1.00", memory: 1G}

  ingress:
    image: nginx:1.27-alpine
    user: "101:101"
    read_only: true
    restart: unless-stopped
    stop_grace_period: 30s
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /var/cache/nginx:rw,noexec,nosuid,nodev,uid=101,gid=101,mode=0755,size=64m
      - /var/run:rw,noexec,nosuid,nodev,uid=101,gid=101,mode=0755,size=16m
      - /tmp:rw,noexec,nosuid,nodev,uid=101,gid=101,mode=1777,size=16m
    depends_on:
      task-api: {condition: service_healthy}
      streaming-gateway: {condition: service_healthy}
    ports: ["${AURACLAW_INGRESS_PORT:-8080}:8080"]
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks: [auraclaw, edge]
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:8080/health/ready]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    deploy:
      replicas: 1
      restart_policy: {condition: on-failure, delay: 5s, max_attempts: 5, window: 60s}
      resources:
        reservations: {cpus: "0.10", memory: 64M}
        limits: {cpus: "0.50", memory: 256M}

networks:
  auraclaw:
    name: ${AURACLAW_INTERNAL_NETWORK:-auraclaw}
    internal: true
  edge:
    name: ${AURACLAW_EDGE_NETWORK:-auraclaw-edge}
  platform:
    name: ${AURACLAW_PLATFORM_NETWORK:-auraclaw-platform}
    external: true

secrets:
  database_url: {file: "${AURACLAW_SECRET_DIR:-.runtime/compose-secrets}/database_url"}
  migration_database_url: {file: "${AURACLAW_SECRET_DIR:-.runtime/compose-secrets}/migration_database_url"}
  task_api_workload_token: {file: "${AURACLAW_SECRET_DIR:-.runtime/compose-secrets}/task_api_workload_token"}
  projection_workload_token: {file: "${AURACLAW_SECRET_DIR:-.runtime/compose-secrets}/projection_workload_token"}
  orchestrator_workload_token: {file: "${AURACLAW_SECRET_DIR:-.runtime/compose-secrets}/orchestrator_workload_token"}
  runtime_workload_token: {file: "${AURACLAW_SECRET_DIR:-.runtime/compose-secrets}/runtime_workload_token"}
  model_gateway_workload_token: {file: "${AURACLAW_SECRET_DIR:-.runtime/compose-secrets}/model_gateway_workload_token"}
  action_hands_workload_token: {file: "${AURACLAW_SECRET_DIR:-.runtime/compose-secrets}/action_hands_workload_token"}
  policy_workload_token: {file: "${AURACLAW_SECRET_DIR:-.runtime/compose-secrets}/policy_workload_token"}
  credential_proxy_workload_token: {file: "${AURACLAW_SECRET_DIR:-.runtime/compose-secrets}/credential_proxy_workload_token"}
  artifact_service_workload_token: {file: "${AURACLAW_SECRET_DIR:-.runtime/compose-secrets}/artifact_service_workload_token"}
  delivery_workload_token: {file: "${AURACLAW_SECRET_DIR:-.runtime/compose-secrets}/delivery_workload_token"}
  streaming_gateway_workload_token: {file: "${AURACLAW_SECRET_DIR:-.runtime/compose-secrets}/streaming_gateway_workload_token"}
  lease_signing_key: {file: "${AURACLAW_SECRET_DIR:-.runtime/compose-secrets}/lease_signing_key"}
  model_api_key: {file: "${AURACLAW_SECRET_DIR:-.runtime/compose-secrets}/model_api_key"}
  vault_token: {file: "${AURACLAW_SECRET_DIR:-.runtime/compose-secrets}/vault_token"}
  obs_ak: {file: "${AURACLAW_SECRET_DIR:-.runtime/compose-secrets}/obs_ak"}
  obs_sk: {file: "${AURACLAW_SECRET_DIR:-.runtime/compose-secrets}/obs_sk"}
  chaintower_workload_token: {file: "${AURACLAW_SECRET_DIR:-.runtime/compose-secrets}/chaintower_workload_token"}
  agent_context_signing_keys_json: {file: "${AURACLAW_SECRET_DIR:-.runtime/compose-secrets}/agent_context_signing_keys_json"}
