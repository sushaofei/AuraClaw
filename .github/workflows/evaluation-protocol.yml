name: evaluation-protocol
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-protocol:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff
      - run: uv sync --extra dev --locked
      - name: Check selection, denominators and actual Runtime fixture controls
        run: uv run pytest tests/unit/test_agent_evaluation.py tests/unit/test_evaluation_cohort.py -q
        env:
          AURACLAW_DISABLE_ENV_FILE: '1'
          AURACLAW_STORAGE_BACKEND: memory
          AURACLAW_RUNTIME_EVENT_BACKEND: memory
# Official datasets, paid calls and raw artifacts stay on the isolated evaluation hosts.
# This dispatch validates the protocol; it does not publish benchmark scores.
